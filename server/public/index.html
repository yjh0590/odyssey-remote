<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Odyssey Remote</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="오디세이 리모컨">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #121418;
      --card-bg: #1C1E24;
      --card-border: #2D3139;
      --accent-blue: #0A84FF;
      --accent-red: #FF453A;
      --accent-green: #30D158;
      --text-main: #FFFFFF;
      --text-sub: #9E9EA7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px);
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .title-box h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
    }

    .title-box p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #23262F;
      border: 1px solid #323642;
      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .status-dot.offline {
      background-color: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
    }

    /* Input Switch Buttons */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-btn {
      background: #252830;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-btn:active {
      transform: scale(0.96);
    }

    .input-btn .icon {
      font-size: 34px;
    }

    .input-btn .name {
      font-size: 16px;
      font-weight: 600;
    }

    .input-btn .desc {
      font-size: 11px;
      color: var(--text-sub);
    }

    .input-btn.active-pc {
      background: rgba(10, 132, 255, 0.18);
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px rgba(10, 132, 255, 0.4);
    }

    .input-btn.active-nintendo {
      background: rgba(255, 69, 58, 0.18);
      border-color: var(--accent-red);
      box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
    }

    /* Brightness Card */
    .brightness-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .brightness-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #FFFFFF;
    }

    .brightness-max {
      font-size: 16px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .slider-wrap {
      width: 100%;
      padding: 8px 0;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 42px;
      background: #2A2E38;
      border-radius: 21px;
      outline: none;
      overflow: hidden;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: -400px 0 0 380px var(--accent-blue);
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      height: 50px;
      background: #272B34;
      border: 1px solid #3A3F4D;
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn:active {
      background: #3A3F4D;
      transform: scale(0.97);
    }

    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .preset-btn {
      background: #252830;
      border: 1px solid #353945;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 500;
      color: #E2E4E9;
      cursor: pointer;
    }

    .preset-btn:active {
      background: #3A3F4D;
    }

    /* Safety test & Toast */
    .safety-box {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.5;
    }

    .test-cycle-btn {
      width: 100%;
      padding: 14px;
      background: #23262F;
      border: 1px dashed #484E5E;
      border-radius: 14px;
      color: #C0C3CC;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .test-cycle-btn:active {
      background: #323642;
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(30, 32, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-box">
        <h1>Odyssey G50D</h1>
        <p>무선 디스플레이 리모컨</p>
      </div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">확인 중...</span>
      </div>
    </header>

    <!-- 외부입력 전환 -->
    <div class="card">
      <div class="card-title">외부 입력 전환</div>
      <div class="input-grid">
        <button class="input-btn active-pc" id="btnPC" onclick="switchInput('pc')">
          <div class="icon">💻</div>
          <div class="name">PC 화면</div>
          <div class="desc">DisplayPort (0x0F)</div>
        </button>
        <button class="input-btn" id="btnNintendo" onclick="switchInput('nintendo')">
          <div class="icon">🎮</div>
          <div class="name">닌텐도 스위치</div>
          <div class="desc">HDMI (0x11)</div>
        </button>
      </div>
    </div>

    <!-- 밝기 제어 -->
    <div class="card">
      <div class="brightness-header">
        <div class="card-title">화면 밝기 조절</div>
        <div>
          <span class="brightness-value" id="brightVal">35</span>
          <span class="brightness-max" id="brightMax">/ 50</span>
        </div>
      </div>

      <div class="slider-wrap">
        <input type="range" id="brightSlider" min="0" max="50" value="35" onchange="onSliderChange(this.value)" oninput="onSliderInput(this.value)">
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="stepBrightness('down')">− 5</button>
        <button class="action-btn" onclick="stepBrightness('up')">+ 5</button>
      </div>

      <div class="presets">
        <button class="preset-btn" onclick="setPreset(15)">🌙 야간 (15)</button>
        <button class="preset-btn" onclick="setPreset(35)">💻 표준 (35)</button>
        <button class="preset-btn" onclick="setPreset(50)">☀️ 최대 (50)</button>
      </div>
    </div>

    <!-- 안전 복귀 테스트 -->
    <div class="card">
      <div class="card-title">양방향 전환 안전 테스트</div>
      <p class="safety-box">
        닌텐도 화면으로 넘겼을 때 PC로 다시 복귀할 수 있는지 안전하게 확인합니다.<br>
        누르면 닌텐도로 전환 후 <strong>5초 뒤 자동으로 PC로 복귀</strong>합니다.
      </p>
      <button class="test-cycle-btn" onclick="runSafetyTest()">
        🔄 5초 자동 복귀 테스트 시작
      </button>
    </div>
  </div>

  <div class="toast" id="toast">메시지</div>

  <script>
    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('Status error');
        const data = await res.json();

        document.getElementById('statusDot').classList.remove('offline');
        document.getElementById('statusText').innerText = '연결됨';

        if (data.brightness) {
          const cur = data.brightness.current;
          const max = data.brightness.max || 50;
          document.getElementById('brightVal').innerText = cur;
          document.getElementById('brightMax').innerText = '/ ' + max;
          const slider = document.getElementById('brightSlider');
          slider.max = max;
          if (!slider.matches(':active')) {
            slider.value = cur;
          }
        }

        if (data.input) {
          const code = data.input.current;
          const btnPC = document.getElementById('btnPC');
          const btnNin = document.getElementById('btnNintendo');

          btnPC.classList.remove('active-pc');
          btnNin.classList.remove('active-nintendo');

          if (code === 15) {
            btnPC.classList.add('active-pc');
          } else if (code === 17) {
            btnNin.classList.add('active-nintendo');
          }
        }
      } catch (err) {
        document.getElementById('statusDot').classList.add('offline');
        document.getElementById('statusText').innerText = '상태 확인 대기';
      }
    }

    async function switchInput(target) {
      vibrate();
      showToast(target === 'pc' ? '💻 PC 화면으로 전환 중...' : '🎮 닌텐도 화면으로 전환 중...');
      try {
        const res = await fetch('/api/input', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target })
        });
        const data = await res.json();
        if (data.success) {
          setTimeout(fetchStatus, 1500);
        } else {
          showToast('❌ 전환 실패: ' + (data.error || '알 수 없음'));
        }
      } catch (e) {
        showToast('❌ 네트워크 오류');
      }
    }

    function onSliderInput(val) {
      document.getElementById('brightVal').innerText = val;
    }

    async function onSliderChange(val) {
      vibrate();
      try {
        const res = await fetch('/api/brightness', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: Number(val) })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`밝기 ${data.brightness} 설정됨`);
        }
      } catch (e) {
        showToast('❌ 밝기 설정 오류');
      }
    }

    async function stepBrightness(action) {
      vibrate();
      try {
        const res = await fetch('/api/brightness', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, step: 5 })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('brightVal').innerText = data.brightness;
          document.getElementById('brightSlider').value = data.brightness;
          showToast(`밝기 ${data.brightness} 설정됨`);
        }
      } catch (e) {
        showToast('❌ 오류 발생');
      }
    }

    async function setPreset(val) {
      document.getElementById('brightSlider').value = val;
      await onSliderChange(val);
    }

    async function runSafetyTest() {
      vibrate();
      if (!confirm('닌텐도로 전환된 후 5초 뒤 자동으로 PC로 복귀합니다. 진행하시겠습니까?')) return;
      showToast('🔄 닌텐도로 전환 후 5초 뒤 자동 복귀합니다...');
      try {
        const res = await fetch('/api/test-cycle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ delaySec: 5 })
        });
        const data = await res.json();
        if (data.success) {
          setTimeout(fetchStatus, 6000);
        }
      } catch (e) {
        showToast('❌ 테스트 실패');
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
